[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-boilerplate"
version = "0.1.0"
description = "FastAPI starting point: async SQLAlchemy, JWT auth, structured logs, security defaults, tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "email-validator>=2.1,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "prometheus-client>=0.20,<1.0",
    "sentry-sdk[fastapi]>=2.14,<3.0",
    "redis>=5,<8",
    "celery[redis]>=5.4,<6",
    "sqladmin>=0.20,<1.0",
    "itsdangerous>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
    "fakeredis>=2.23,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = [
    "B008", # FastAPI's Depends()/Query() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]
"alembic/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# celery ships no py.typed marker and no stubs worth depending on.
module = ["celery", "celery.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Celery tasks are decorated by an untyped library; the functions themselves
# are still fully annotated and tested.
module = ["app.worker.*"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
